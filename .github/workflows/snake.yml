name: Generate Snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Leviurfr
          outputs: |
            dist/github-snake.svg?color_snake=e60012&color_dots=0d0000,2b0000,6b0000,b3001b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=e60012
      - uses: crazy-max/ghaction-github-pages@v3
        with: { target_branch: output, build_dir: dist }
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
