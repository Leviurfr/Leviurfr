<linearGradient id="sw" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="176"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="999" height="175" rx="16" fill="url(#bg)" stroke="#1f2637"/>
