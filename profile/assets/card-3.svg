<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-label="Greed Authority: CLI produktivitas untuk developer: scaffold, auto-commit, dan deploy otomatis.">
<title>Greed Authority: CLI produktivitas untuk developer: scaffold, auto-commit, dan deploy otomatis.</title>
<defs>
