<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Statistik GitHub: 0 kontribusi dalam 12 bulan, streak 0 hari">
<title>Statistik GitHub</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10141f"/><stop offset="1" stop-color="#080a10"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<clipPath id="bar"><rect x="40" y="246" width="0" height="10" rx="5"><animate attributeName="width" from="0" to="920" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></rect></clipPath>
</defs>
<rect x=".5" y=".5" width="999" height="319" rx="16" fill="url(#bg)" stroke="#1f2637"/>
<text x="40" y="88" font-family="Georgia,'Times New Roman','Noto Serif','DejaVu Serif',serif" font-size="44" font-weight="700" fill="#e8f0f2">0</text>
<text x="40" y="116" font-family="'Segoe UI','Helvetica Neue',Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="16" fill="#8994a8">Kontribusi 12 bulan</text>
<text x="230" y="88" font-family="Georgia,'Times New Roman','Noto Serif','DejaVu Serif',serif" font-size="44" font-weight="700" fill="#e8f0f2">0</text>
<text x="230" y="116" font-family="'Segoe UI','Helvetica Neue',Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="16" fill="#8994a8">Commit</text>
<text x="420" y="88" font-family="Georgia,'Times New Roman','Noto Serif','DejaVu Serif',serif" font-size="44" font-weight="700" fill="#e8f0f2">0</text>
<text x="420" y="116" font-family="'Segoe UI','Helvetica Neue',Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="16" fill="#8994a8">Pull request</text>
<text x="40" y="184" font-family="Georgia,'Times New Roman','Noto Serif','DejaVu Serif',serif" font-size="44" font-weight="700" fill="#e8f0f2">0</text>
<text x="40" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="16" fill="#8994a8">Issue</text>
<text x="230" y="184" font-family="Georgia,'Times New Roman','Noto Serif','DejaVu Serif',serif" font-size="44" font-weight="700" fill="#e8f0f2">0</text>
<text x="230" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="16" fill="#8994a8">Repositori publik</text>
<text x="420" y="184" font-family="Georgia,'Times New Roman','Noto Serif','DejaVu Serif',serif" font-size="44" font-weight="700" fill="#e8f0f2">0</text>
<text x="420" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="16" fill="#8994a8">Bintang diterima</text>
<line x1="640" y1="40" x2="640" y2="210" stroke="#1f2637"/>
<circle cx="800" cy="112" r="56" fill="none" stroke="#1f2637" stroke-width="9"/>
<circle cx="800" cy="112" r="56" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="351.86" transform="rotate(-90 800 112)"><animate attributeName="stroke-dashoffset" from="351.86" to="351.86" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></circle>
<text x="800" y="120" text-anchor="middle" font-family="Georgia,'Times New Roman','Noto Serif','DejaVu Serif',serif" font-size="34" font-weight="700" fill="#e8f0f2">0</text>
<text x="800" y="140" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,'Noto Sans','DejaVu Sans',sans-serif" font-size="14" fill="#8994a8">hari berturut</text>
<text x="800" y="204" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="14" fill="#b4bfd1">terpanjang 0 hari, aktif 0 hari</text>
<text x="40" y="288" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="14" fill="#8994a8">Menunggu data pertama. Buka tab Actions, pilih workflow Profil, lalu klik Run workflow.</text>
<rect x="40" y="246" width="920" height="10" rx="5" fill="#1f2637"/>
</svg>
